name: Bank API test

"on":
  push:
    branches: [main]
    paths:
      - "bank-api/**"
      - "bankapp/**"
      - "shared/**"
      - ".github/workflows/bank_api.yml"
  pull_request:
    paths:
      - "bank-api/**"
      - "bankapp/**"
      - "shared/**"
      - ".github/workflows/bank_api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: bank-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: bank-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          mkdir -p artifacts
          npm test -- --coverage --ci --runInBand --json --outputFile=artifacts/unit_tests.json > artifacts/unit_tests.txt 2>&1

      - name: Run e2e tests
        run: |
          npm run test:e2e -- --coverage --runInBand > artifacts/e2e_tests.txt 2>&1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-api-test-results
          path: |
            bank-api/artifacts
            bank-api/coverage

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bankapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: bankapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run React Testing Library tests
        run: npm test -- --ci --runInBand

  deploy:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: bank-api/package-lock.json

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: bank-api-test-results
          path: build

      - name: Show files / Check files
        run: ls -R build

      - name: Deploy
        run: echo AWS deploying ...
